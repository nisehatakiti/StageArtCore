<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050609"/><stop offset=".55" stop-color="#111116"/><stop offset="1" stop-color="#17120f"/></linearGradient>
 <radialGradient id="warm" cx="50%" cy="72%" r="48%"><stop offset="0" stop-color="#d6a35c" stop-opacity=".58"/><stop offset=".38" stop-color="#8b5d32" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
