name: Apply verified StageArt fixes
on:
  push:
    branches: [main]
jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'stageart: apply verified fixes' && github.event.head_commit.message != 'stageart: cleanup fix runner' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source transformations
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/stageart-fix-script.b64 ]; then exit 0; fi
          base64 -d .github/stageart-fix-script.b64 | tar -xz -C /tmp
          python3 /tmp/stageart_apply_fix.py
          php -l src/Domain/Production/ProductionRepository.php
          php -l src/Presentation/Admin/ProductionAdmin.php
          php -l src/Presentation/PublicSite/ProductionRouter.php
          php -l src/Plugin.php
          php -l theme/stageart/functions.php
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'stageart: apply verified fixes'
          git push
