name: Apply StageArt fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply StageArt fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          base64 -d .github/stageart-fixes.b64 | gzip -d > /tmp/stageart-fixes.patch
          git apply --whitespace=nowarn /tmp/stageart-fixes.patch
      - name: PHP syntax check
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l stageart-core.php
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src theme
          git diff --cached --quiet && exit 0
          git commit -m 'Apply StageArt fixes'
          git push origin main
