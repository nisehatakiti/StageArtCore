name: Apply StageArt fixes

on:
  push:
    branches: [main]

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'stageart: fix production display and layout') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stageart-payload/01 .github/stageart-payload/02 .github/stageart-payload/03 .github/stageart-payload/04 .github/stageart-payload/05 .github/stageart-payload/06 .github/stageart-payload/07 .github/stageart-payload/08 > /tmp/stageart.b64
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(Path('/tmp/stageart.b64').read_bytes()))
          marker = b'@@FILE@@'
          for part in raw.split(marker):
              if not part.strip():
                  continue
              path, content = part.split(b'\n', 1)
              content = content.rstrip(b'\n')
              p = Path(path.decode())
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content + b'\n')
          PY
          for f in src/Domain/Production/ProductionRepository.php src/Presentation/Admin/ProductionAdmin.php src/Presentation/Admin/ProductionLayoutAdmin.php src/Presentation/PublicSite/ProductionRouter.php src/Plugin.php theme/stageart/style.css theme/stageart/functions.php; do test -f "$f"; done
          php -l src/Domain/Production/ProductionRepository.php
          php -l src/Presentation/Admin/ProductionAdmin.php
          php -l src/Presentation/Admin/ProductionLayoutAdmin.php
          php -l src/Presentation/PublicSite/ProductionRouter.php
          php -l src/Plugin.php
          php -l theme/stageart/functions.php
          rm -rf .github/stageart-payload .github/workflows/apply-stageart-fixes.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'stageart: fix production display and layout'
          git push
