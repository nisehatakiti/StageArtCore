name: Build StageArt Package

on:
  push:
    branches: [main]
    paths:
      - 'stageart-core.php'
      - 'src/**'
      - 'tools/**'
      - 'theme/stageart/**'
      - '.github/workflows/build-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find src theme/stageart -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l stageart-core.php

      - name: Validate plugin and theme
        run: |
          test -f stageart-core.php
          test -f theme/stageart/style.css
          test -f theme/stageart/functions.php
          test -f theme/stageart/front-page.php
          grep -q '^Theme Name:' theme/stageart/style.css

      - name: Build installable Core and Theme ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist StageArtCore.zip
          mkdir -p dist/package/StageArtCore
          mkdir -p dist/core/StageArtCore dist/theme/stageart

          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='*.zip' ./ dist/core/StageArtCore/
          rm -rf dist/core/StageArtCore/theme
          cp -a theme/stageart/. dist/theme/stageart/

          cd dist/core
          zip -r ../package/StageArtCore/Core.zip StageArtCore >/dev/null
          cd ../theme
          zip -r ../package/StageArtCore/Theme.zip stageart >/dev/null
          cd ../package
          zip -r ../../StageArtCore.zip StageArtCore >/dev/null

      - name: Validate ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -l StageArtCore.zip
          unzip -l StageArtCore.zip | grep -q 'StageArtCore/Core.zip'
          unzip -l StageArtCore.zip | grep -q 'StageArtCore/Theme.zip'

          unzip -q StageArtCore.zip -d dist/outer-check
          unzip -l dist/outer-check/StageArtCore/Core.zip | grep -q 'StageArtCore/stageart-core.php'
          unzip -l dist/outer-check/StageArtCore/Theme.zip | grep -q 'stageart/style.css'

      - name: Upload StageArt package
        uses: actions/upload-artifact@v4
        with:
          name: StageArtCore
          path: StageArtCore.zip
          if-no-files-found: error
          retention-days: 90
