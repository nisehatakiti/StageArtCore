name: Build StageArt Package

on:
  push:
    branches: [main]
    paths:
      - 'stageart-core.php'
      - 'src/**'
      - 'tools/**'
      - 'theme/stageart/**'
      - '.github/workflows/build-distribution.yml'
      - '.github/stageart-admin-patch.py'
      - '.github/stageart-finalize-schedule.py'
      - '.github/stageart-final-fix.py'
      - '.github/stageart-label-fix.py'
      - '.github/stageart-performance-label-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply admin UI fix
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f .github/stageart-admin-patch.py ]; then
            python3 .github/stageart-admin-patch.py
            php -l src/Presentation/Admin/ProductionAdmin.php
            git diff --check
            rm -f .github/stageart-admin-patch.py
            changed=1
          fi
          if [ -f .github/stageart-finalize-schedule.py ]; then
            python3 .github/stageart-finalize-schedule.py
            php -l src/Presentation/PublicSite/ProductionRouter.php
            git diff --check
            changed=1
          fi
          if [ -f .github/stageart-final-fix.py ]; then
            python3 .github/stageart-final-fix.py
            php -l src/Domain/Production/ProductionRepository.php
            php -l stageart-core.php
            git diff --check
            rm -f .github/stageart-final-fix.py
            changed=1
          fi
          if [ -f .github/stageart-label-fix.py ]; then
            python3 .github/stageart-label-fix.py
            php -l src/Presentation/Admin/ProductionAdmin.php
            php -l src/Domain/Production/ProductionRepository.php
            git diff --check
            rm -f .github/stageart-label-fix.py
            changed=1
          fi
          if [ -f .github/stageart-performance-label-fix.py ]; then
            python3 .github/stageart-performance-label-fix.py
            php -l src/Presentation/Admin/ProductionAdmin.php
            git diff --check
            rm -f .github/stageart-performance-label-fix.py
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'stageart: apply schedule fixes'
            git push
          fi

      - name: PHP syntax check
        run: |
          find src theme/stageart -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l stageart-core.php

      - name: Validate plugin and theme
        run: |
          test -f stageart-core.php
          test -f theme/stageart/style.css
          test -f theme/stageart/functions.php
          test -f theme/stageart/front-page.php
          grep -q '^Theme Name:' theme/stageart/style.css

      - name: Build installable Core and Theme ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist StageArtCore.zip
          mkdir -p dist/core/StageArtCore dist/theme/stageart dist/package
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='*.zip' ./ dist/core/StageArtCore/
          rm -rf dist/core/StageArtCore/theme
          cp -a theme/stageart/. dist/theme/stageart/
          cd dist/core
          zip -r ../package/Core.zip StageArtCore >/dev/null
          cd ../theme
          zip -r ../package/Theme.zip stageart >/dev/null
          cd ../package
          zip -r ../../StageArtCore.zip Core.zip Theme.zip >/dev/null

      - name: Validate ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -l StageArtCore.zip
          unzip -l StageArtCore.zip | grep -q '^.* Core.zip$'
          unzip -l StageArtCore.zip | grep -q '^.* Theme.zip$'
          ! unzip -l StageArtCore.zip | grep -q 'StageArtCore/Core.zip'
          ! unzip -l StageArtCore.zip | grep -q 'StageArtCore/Theme.zip'
          rm -rf dist/outer-check
          unzip -q StageArtCore.zip -d dist/outer-check
          test -f dist/outer-check/Core.zip
          test -f dist/outer-check/Theme.zip
          unzip -l dist/outer-check/Core.zip | grep -q 'StageArtCore/stageart-core.php'
          unzip -l dist/outer-check/Theme.zip | grep -q 'stageart/style.css'

      - name: Upload StageArt package
        uses: actions/upload-artifact@v4
        with:
          name: StageArtCore
          path: StageArtCore.zip
          if-no-files-found: error
          retention-days: 90