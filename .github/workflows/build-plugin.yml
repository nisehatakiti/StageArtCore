name: Build StageArtCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair ProductionAdmin
        run: php tools/repair-production-admin.php
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Presentation/Admin/ProductionAdmin.php
          if ! git diff --cached --quiet; then
            git commit -m "Fix ProductionAdmin syntax"
            git push
          fi
      - name: PHP syntax check
        run: |
          set -e
          find src -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l stageart-core.php
      - name: Build plugin ZIP
        run: |
          set -e
          rm -rf dist stageart-core.zip
          mkdir -p dist/StageArtCore
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='*.zip' ./ dist/StageArtCore/
          cd dist
          zip -r ../stageart-core.zip StageArtCore >/dev/null
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StageArtCore
          path: stageart-core.zip
          if-no-files-found: error
