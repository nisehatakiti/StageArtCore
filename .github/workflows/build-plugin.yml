name: Build StageArtCore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist stageart-core.zip
          mkdir -p dist/StageArtCore
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='*.zip' ./ dist/StageArtCore/
          cd dist
          zip -r ../stageart-core.zip StageArtCore >/dev/null
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StageArtCore
          path: stageart-core.zip
          if-no-files-found: error
